/* Hollín: la ropa de faena, sacada de las fotos de Petrurbe (adoquín mojado, callejón de
   ladrillo, cuaderno de estraza escrito a mano, cuero remendado, una llave oxidada, un farol).
   Un mozo pobre que hace los recados en el callejón y lo apunta todo en su libreta.
   Papel de estraza con renglones y borde roto para todo lo que se lee; remiendos de cuero para
   los oficios; palotes para contar; el farol solo para lo que está pasando; el óxido solo para
   el botón que manda trabajar. Letra: IM Fell English (imprenta vieja), Courier Prime (lo que

:root {
  --hollin: #0F0C08;
  --carbonilla: #221811;
  --lapiz: #42362D;
  --lapiz-tenue: #5A4A3C;
  --adoquin: #4A4641;
  --cuero: #745649;
  --cuero-oscuro: #5C483C;
  --oxido: #8A4A26;
  --oxido-hondo: #6E3A1D;
  --ceniza: #999997;
  --farol: #D6B094;
  --estraza: #DBC6A5;
  --estraza-clara: #E9D9BF;
  --estraza-vieja: #B9A889;
  --cal: #E1DBD5;
  --cal-sucia: #CFC6BC;
  --sangre: #7A2A12;
  --imprenta: "IM Fell English", Georgia, "Times New Roman", serif;
  --versalita: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --libreta: "Courier Prime", "Courier New", Consolas, monospace;
  --mano: "Caveat", "Segoe Print", cursive;
  --renglones: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, rgba(66,54,45,.22) 31px, rgba(66,54,45,.22) 32px);
  --roto: polygon(0 0,100% 0,100% calc(100% - 8px),97% 100%,93% calc(100% - 6px),88% 100%,83% calc(100% - 8px),78% 100%,72% calc(100% - 5px),66% 100%,60% calc(100% - 8px),54% 100%,48% calc(100% - 6px),42% 100%,36% calc(100% - 8px),30% 100%,24% calc(100% - 5px),18% 100%,12% calc(100% - 8px),6% 100%,0 calc(100% - 5px));
  --rotito: polygon(0 0,100% 0,100% calc(100% - 7px),94% 100%,86% calc(100% - 5px),77% 100%,68% calc(100% - 7px),58% 100%,49% calc(100% - 5px),40% 100%,30% calc(100% - 7px),21% 100%,12% calc(100% - 5px),4% 100%,0 calc(100% - 6px));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--carbonilla); color: var(--cal);
  font: 17px/1.45 var(--imprenta);
  display: grid; grid-template-columns: 248px 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
:focus-visible { outline: 2px dashed var(--farol); outline-offset: 3px; }
::selection { background: var(--farol); color: var(--hollin); }
code { font: .92em var(--libreta); }
.sc { font-family: var(--versalita); letter-spacing: .05em; }
.mano { font-family: var(--mano); font-weight: 600; }
.cifra { font-family: var(--libreta); }

  display: flex; flex-direction: column; min-height: 0; padding: 26px 18px 18px; gap: 22px;
}
.marca { display: flex; align-items: flex-end; gap: 10px; padding: 0 4px; }
.marca svg { flex: none; }
.marca b { font: italic 400 52px/.78 var(--imprenta); color: var(--cal); letter-spacing: -.01em; }
.menu-lateral { display: flex; flex-direction: column; gap: 4px; }
.ir {
  width: 100%; text-align: left; border: 0; background: none; color: var(--cal);
  font: 20px/1.2 var(--versalita); letter-spacing: .05em; padding: 11px 14px 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.ir:hover { color: var(--farol); }
.ir.activo { background: var(--estraza); color: var(--lapiz); clip-path: var(--rotito); padding-bottom: 18px; }
.ir small { font: 14px var(--libreta); color: var(--ceniza); letter-spacing: 0; }
.ir.activo small { color: var(--lapiz); }
.titulo-lista { margin: 4px 4px 2px; font: 15px var(--versalita); letter-spacing: .06em; color: var(--ceniza); border-bottom: 1px solid var(--adoquin); padding-bottom: 6px; }
#bloque-encargos { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#lista-encargos { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.item {
  width: 100%; text-align: left; border: 0; background: none; color: var(--cal-sucia);
  padding: 8px 10px; display: flex; gap: 10px; align-items: flex-start;
}
.item:hover { background: rgba(225,219,213,.06); color: var(--cal); }
.item.activo { background: rgba(214,176,148,.12); color: var(--cal); box-shadow: inset 3px 0 0 var(--farol); }
.item span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 15px; line-height: 1.25; }
.item small { display: block; font: 12px var(--libreta); color: var(--ceniza); margin-top: 2px; }
.item .punto { width: 8px; height: 8px; flex: none; margin-top: 6px; background: var(--adoquin); }
.item .punto.listo { background: var(--cal-sucia); }
.item .punto.vivo { background: var(--farol); box-shadow: 0 0 0 4px rgba(214,176,148,.22); animation: latido 1.4s infinite; }
.item .punto.pendiente { background: var(--farol); }
.item .punto.mal { background: var(--oxido); }
.vacio-lista { padding: 8px 10px; color: var(--ceniza); font: 22px/1.1 var(--mano); }
.pie-lateral { font: 12px/1.6 var(--libreta); color: var(--ceniza); padding: 0 4px; }
@keyframes latido { 50% { opacity: .45; } }

/* ---------- lo principal ---------- */
main { overflow: auto; min-height: 0; }
.lienzo { max-width: 980px; margin: 0 auto; padding: 34px 40px 110px; }
h1 { font: italic 400 46px/1.02 var(--imprenta); margin: 0 0 10px; color: var(--cal); letter-spacing: -.005em; }
h2 { font: 400 24px/1.15 var(--versalita); letter-spacing: .04em; margin: 0 0 10px; }
.sub { color: var(--cal-sucia); margin: 0 0 24px; font-size: 18px; max-width: 64ch; }
.dice { font: 600 28px/1.15 var(--mano); color: var(--farol); margin: 0 0 18px; }
.oculto { display: none !important; }
.fila { display: flex; gap: 12px; align-items: center; }
.derecha { margin-left: auto; }
a { color: var(--farol); }

/* el camino de un recado: el recado · faenando · la libreta */
.pasos-guia { list-style: none; margin: -8px 0 26px; padding: 0 0 10px; display: flex; gap: 28px; border-bottom: 1px dashed var(--cuero); }
.pasos-guia li { font: 18px var(--versalita); letter-spacing: .05em; color: #8C857D; display: flex; gap: 8px; align-items: baseline; }
.pasos-guia li .n { font: 13px var(--libreta); }
.pasos-guia li.hecho-fijo { color: var(--ceniza); }
.pasos-guia li.ahora { color: var(--cal); box-shadow: 0 12px 0 -9px var(--farol); }

/* papel de estraza: todo lo que se lee y se escribe */
.hoja {
  position: relative; background-color: var(--estraza); background-image: var(--renglones);
  color: var(--lapiz); padding: 26px 32px 40px; clip-path: var(--roto);
}
.hoja + .hoja, .hoja + .remiendo, .remiendo + .hoja { margin-top: 22px; }
.hoja h2 { color: var(--lapiz); }
.hoja .mano { color: var(--lapiz); }
.hoja a { color: var(--oxido-hondo); }
.pista { font-size: 15px; color: var(--ceniza); }
.hoja .pista { color: var(--lapiz-tenue); }

.campo { display: block; margin-bottom: 20px; }
.campo > span { display: block; font: 19px var(--versalita); letter-spacing: .04em; margin-bottom: 4px; }
.campo > small { display: block; color: var(--lapiz-tenue); margin-top: 4px; font: 22px/1.1 var(--mano); }
input[type=text], textarea {
  width: 100%; font: 18px/32px var(--libreta); color: #1F1A15; background: transparent;
  border: 0; border-bottom: 2px solid var(--lapiz); padding: 0 2px; min-height: 40px;
}
textarea { resize: none; overflow: hidden; border-bottom: 0; padding-top: 0; }
input[type=text]:focus, textarea:focus { outline: none; background: rgba(214,176,148,.38); }
::placeholder { color: #7D6A57; }
.oscuro input[type=text] { color: var(--cal); border-bottom-color: var(--estraza); }
.oscuro ::placeholder { color: var(--ceniza); }

.botones { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.btn {
  border: 2px solid var(--lapiz); background: transparent; color: var(--lapiz);
  font: 19px/1 var(--versalita); letter-spacing: .05em; padding: 12px 18px; min-height: 46px;
  display: inline-flex; align-items: center; gap: 8px; transition: background .15s, transform .1s;
}
.btn:hover { background: rgba(66,54,45,.1); }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--oxido); border-color: var(--oxido); color: var(--cal); }
.btn.principal:hover { background: var(--oxido-hondo); border-color: var(--oxido-hondo); }
.btn.grande { font-size: 23px; padding: 15px 28px; }
.btn.discreto { border-color: transparent; color: var(--lapiz-tenue); }
.btn.discreto:hover { background: none; text-decoration: underline; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.oscuro .btn, .btn.claro { border-color: var(--estraza); color: var(--estraza); }
.oscuro .btn.principal { border-color: var(--oxido); color: var(--cal); }
.oscuro .btn.discreto { border-color: transparent; color: var(--cal-sucia); }

/* sí/no a lápiz: las casillas y los sitios */
.webs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.web, .chip {
  border: 2px solid var(--lapiz); background: transparent; color: var(--lapiz);
  padding: 8px 13px; min-height: 42px; font: 16px var(--libreta);
  display: inline-flex; gap: 8px; align-items: center;
}
.web:hover, .chip:hover { background: rgba(66,54,45,.1); }
.web.on { background: var(--lapiz); color: var(--estraza-clara); }
.chip .marca-check { width: 18px; height: 18px; border: 2px solid currentColor; display: grid; place-items: center; }
.chip.on { background: var(--lapiz); color: var(--estraza-clara); }
.valor { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; font: 15px var(--libreta); color: var(--lapiz); }
.valor input { flex: 1; }
.valor input[inputmode=numeric] { flex: none; width: 64px; text-align: center; }
details summary { cursor: pointer; font: 18px var(--versalita); letter-spacing: .04em; padding: 6px 0; }

.opcion { display: flex; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px dashed rgba(66,54,45,.4); }
.opcion div { flex: 1; }
.opcion b { display: block; font-weight: 400; font: 19px var(--versalita); letter-spacing: .04em; }
.opcion small { color: var(--lapiz-tenue); font: 21px/1.1 var(--mano); }
.interruptor { position: relative; width: 30px; height: 30px; flex: none; }
.interruptor input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.interruptor span { position: absolute; inset: 0; border: 2px solid var(--lapiz); pointer-events: none; }
.interruptor input:checked + span::after { content: "✓"; position: absolute; inset: -6px 0 0 3px; font: 700 30px/1 var(--mano); color: var(--lapiz); }
.interruptor input:focus-visible + span { outline: 2px dashed var(--oxido); outline-offset: 3px; }

/* el oficio elegido, cosido arriba del recado */
.obra-elegida { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 12px 16px; margin: 0 0 20px; background: var(--cuero); color: var(--estraza-clara); outline: 2px dashed var(--estraza-clara); outline-offset: -7px; }
.obra-elegida .sc { font-size: 14px; }
.obra-elegida b { font: 22px var(--versalita); letter-spacing: .04em; }
.obra-elegida small { font-size: 15px; }

.aviso { padding: 14px 18px; margin-bottom: 18px; border-left: 6px solid var(--ceniza); background: rgba(225,219,213,.06); }

.jornal { grid-column: 2; grid-row: 1 / span 3; text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

.palotes .haz { position: relative; display: flex; gap: 5px; height: 30px; }

}

.libreta-abierta { background: var(--cuero); padding: 10px; box-shadow: inset 0 0 0 2px var(--lapiz); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.libreta-abierta > section { background-color: var(--estraza); background-image: var(--renglones); color: var(--lapiz); padding: 22px 26px 26px; min-width: 0; }

.capturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 24px 18px; padding-top: 10px; }

.libreta-pie { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }

/* Las webs ya usadas en otros recados, para elegirlas de un clic. */
function websUsadas() {
  const vistas = new Map();
  for (const e of ENCARGOS) {
    if (e.superficie !== "web" || !e.donde) continue;
    try { const u = new URL(e.donde); if (!vistas.has(u.origin)) vistas.set(u.origin, {url: e.donde, nombre: u.hostname + (u.port ? ":" + u.port : "")}); } catch { }
  }
  return [...vistas.values()].slice(0, 6);
}

function nombreWeb(url) {
  try { return new URL(url).hostname; } catch { return t("la_web"); }
}

/* Palotes, como en la pared de una celda: de cinco en cinco. */
function palotes(n, tope = 40) {
  const m = Math.min(n, tope);
  let html = "";
  for (let i = 0; i < m; i += 5) {
    const k = Math.min(5, m - i);
    html += `<span class="haz ${k === 5 ? "cinco" : ""}">${"<i></i>".repeat(Math.min(k, 4))}</span>`;
  }
  return html;
}

  clearInterval(sondeo); sondeo = null;
  const v = $("#vista");
  if (vistaPintada !== VISTA) { $("main").scrollTop = 0; vistaPintada = VISTA; }
  v.classList.remove("vista"); void v.offsetWidth; v.classList.add("vista");

/* ---------- diálogo ---------- */
function confirmar(titulo, texto, si, fn) {
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  d.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>
    <div class="botones"><button class="btn principal" id="d-si">${esc(si)}</button><button class="btn discreto" id="d-no">${t("mejor_no")}</button></div></div>`;
  document.body.append(d);
  const cerrar = () => { d.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", tecla);
  $("#d-no", d).onclick = cerrar;
  d.onclick = (e) => { if (e.target === d) cerrar(); };
  $("#d-si", d).onclick = () => { cerrar(); fn(); };
  $("#d-si", d).focus();
}

/* ---------- los recados ---------- */
let ENCARGOS = [];
let REPERTORIO = [];
let E = null;              // recado abierto
let PEDIDO = null;         // lo que se está pidiendo
const CHECK = '<svg width="11" height="11" viewBox="0 0 10 10"><path d="m1.5 5 2.2 2.4L8.6 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ESTADOS = {
  "en-marcha": ["st_marcha", "vivo"], pregunta: ["st_pregunta", "pendiente"], hecho: ["st_hecho", "listo"],
  pendiente: ["st_pendiente", "pendiente"], "sin terminar": ["st_medias", "mal"], parado: ["st_parado", ""],
  interrumpido: ["st_cortado", "mal"],
};
const PERMISOS = ["enviar", "borrar", "pagar", "aceptar"];
const categoria = (c) => TEXTOS["c_" + c] ? t("c_" + c) : c;
const base = (ruta) => String(ruta || "").split(/[\\/]/).pop();
const conHuecos = (s) => esc(s).replace(/\{([\p{L}\p{N}_]+)\}/gu, '<span class="hueco">$1</span>');

async function cargarEncargos() {
  [ENCARGOS, REPERTORIO] = await Promise.all([api("/api/encargos"), api("/api/repertorio")]);
  $("#n-oficios").textContent = REPERTORIO.length || "";
  pintarEncargos();
}

function pintarEncargos() {
  const l = $("#lista-encargos"); if (!l) return;
  if (!ENCARGOS.length) { l.innerHTML = `<div class="vacio-lista">${t("vacio_lista")}</div>`; return; }
  l.innerHTML = ENCARGOS.slice(0, 15).map((e) => {
    const [k, cls] = ESTADOS[e.estado] || [e.estado, ""];
    return `<button class="item ${E && E.id === e.id && VISTA === "encargo" ? "activo" : ""}" data-id="${esc(e.id)}">
      <i class="punto ${cls}"></i><span>${esc(e.objetivo)}<small>${esc(t(k))}</small></span></button>`;
  }).join("");
  l.querySelectorAll(".item").forEach((b) => b.onclick = () => abrirEncargo(b.dataset.id));
}

async function abrirEncargo(id) {
  E = await api(`/api/encargos/${id}`);
  if (E.error) { E = null; return cargarEncargos(); }
  VISTA = "encargo"; pintar(); pintarEncargos();
}

function guiaEncargo(actual) {
  const nombres = [t("el_recado"), t("faenando"), t("la_libreta")];
  return `<ol class="pasos-guia">${nombres.map((n, i) => `<li class="${i === actual ? "ahora" : i < actual ? "hecho-fijo" : ""}">
    <span class="n">${i < actual ? "✓" : ["I", "II", "III"][i]}</span>${n}</li>`).join("")}</ol>`;
}

/* Un nombre para un oficio y, con «Exportar como skill», también su SKILL.md. */
function pedirNombre(titulo, texto, valor, si, fn) {
  const d = document.createElement("div");
  d.className = "dialogo-fondo";
  d.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>
    <input type="text" id="d-texto" value="${esc(valor)}" spellcheck="false" aria-label="${esc(titulo)}">
    <div class="opcion" style="margin-top:14px"><div><b>${t("exportar_b")}</b><small>${t("exportar_s")}</small></div>
      <label class="interruptor"><input type="checkbox" id="d-skill" aria-label="${t("exportar_b")}"><span></span></label></div>
    <div class="botones" style="margin-top:18px"><button class="btn principal" id="d-si">${esc(si)}</button><button class="btn discreto" id="d-no">${t("mejor_no")}</button></div></div>`;
  document.body.append(d);
  const i = $("#d-texto", d); i.focus(); i.select();
  const cerrar = () => d.remove();
  $("#d-no", d).onclick = cerrar;
  d.onclick = (e) => { if (e.target === d) cerrar(); };
  const ok = async () => { const s = i.value.trim(); if (!s) return i.focus(); if (await fn(s, $("#d-skill", d).checked) !== false) cerrar(); };
  $("#d-si", d).onclick = ok;
  i.onkeydown = (e) => { if (e.key === "Enter") ok(); if (e.key === "Escape") cerrar(); };
}

const aprendida = (r) => { avisar(t("ya_se", {n: r.nombre})); if (r.skill) setTimeout(() => avisar(t("skill_escrita", {r: r.skill})), 2700); if (r.skill_error) setTimeout(() => avisar(r.skill_error), 2700); };

const nombreObra = (texto) => texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);

/* ---------- dar un recado ---------- */
function pedidoNuevo(obra) {
  const web = websUsadas()[0];
  const q = {objetivo: "", tipo: "web", url: web ? web.url : "", app: "", permitir: [], ver: false, capturas: true,
    aprender: "", exportar_skill: false, habilidad: "", sin_modelo: false, parametros: {}, max_pasos: 30, max_minutos: 10};
  if (obra) {
    q.habilidad = obra.nombre; q.parametros = {...obra.parametros};
    if (obra.superficie === "escritorio") { q.tipo = "app"; q.app = obra.inicio; } else if (obra.inicio) q.url = obra.inicio;
  }
  return q;
}

function encargar(v) {
  const q = PEDIDO || (PEDIDO = pedidoNuevo());
  const obra = REPERTORIO.find((o) => o.nombre === q.habilidad);
  const webs = websUsadas();
  const otraWeb = q.tipo === "web" && !webs.some((w) => w.url === q.url);
  const params = obra ? Object.entries(obra.parametros) : [];
  v.innerHTML = guiaEncargo(0) + `<form class="hoja" id="tarjeta-encargo" onsubmit="return false">
      <h1 style="color:var(--lapiz)">${t("h1_recado")}</h1>
      ${obra ? `<div class="obra-elegida"><span class="sc">${t("de_oficio")}</span><b>${esc(obra.nombre)}</b><small>${conHuecos(obra.descripcion)}</small>
        <button type="button" class="chip" id="e-soltar">${ico("quitar", 13)} ${t("sin_oficio")}</button></div>` : ""}
      <label class="campo"><span>${t("que_hacer")}</span>
        <textarea id="e-objetivo" rows="2" maxlength="600" placeholder="${esc(obra ? t("ph_obra") : t("ph_objetivo"))}">${esc(q.objetivo)}</textarea>
        <small>${obra ? t("nota_obra") : t("nota_objetivo")}</small></label>
      ${params.length ? `<div class="campo"><span>${t("datos_vez")}</span>
        ${params.map(([k, ej]) => `<label class="valor">${esc(k)}<input type="text" data-param="${esc(k)}" value="${esc(q.parametros[k] ?? ej)}" spellcheck="false"></label>`).join("")}
        <div class="opcion"><div><b>${t("sin_pensar_b")}</b><small>${t("sin_pensar_s")}</small></div>
          <label class="interruptor"><input type="checkbox" id="e-sin" ${q.sin_modelo ? "checked" : ""} aria-label="${t("sin_pensar")}"><span></span></label></div></div>` : ""}
      <div class="campo"><span>${t("donde")}</span>
        <div class="webs">
          ${webs.map((w) => `<button type="button" class="web ${q.tipo === "web" && q.url === w.url ? "on" : ""}" data-url="${esc(w.url)}" title="${esc(w.url)}">${ico("globo", 14)} ${esc(w.nombre)}</button>`).join("")}
          <button type="button" class="web ${otraWeb ? "on" : ""}" data-otra="web">${ico("lapiz", 14)} ${webs.length ? t("otra_web") : t("una_web")}</button>
          <button type="button" class="web ${q.tipo === "app" ? "on" : ""}" data-otra="app">${ico("pantalla", 14)} ${t("un_programa")}</button></div>
        <input type="text" id="e-url" class="${otraWeb ? "" : "oculto"}" value="${esc(otraWeb ? q.url : "")}" placeholder="${esc(t("ph_url"))}" spellcheck="false" aria-label="${esc(t("aria_url"))}">
        <input type="text" id="e-app" class="${q.tipo === "app" ? "" : "oculto"}" value="${esc(q.app)}" placeholder="${esc(t("ph_app"))}" spellcheck="false" aria-label="${esc(t("aria_app"))}">
        <small id="e-app-nota" class="${q.tipo === "app" ? "" : "oculto"}">${t("nota_app")}</small></div>
      <div class="campo"><span>${t("sin_firma")}</span>
        <div class="webs">${PERMISOS.map((k) => `<button type="button" class="chip ${q.permitir.includes(k) ? "on" : ""}" data-permiso="${k}"><span class="marca-check">${q.permitir.includes(k) ? CHECK : ""}</span>${t("p_" + k)}</button>`).join("")}</div>
        <small>${t("nota_firma")}</small></div>
      <div class="opcion"><div><b>${t("mirar_b")}</b><small>${t("mirar_s")}</small></div>
        <label class="interruptor"><input type="checkbox" id="e-ver" ${q.ver ? "checked" : ""} aria-label="${esc(t("mirar_b"))}"><span></span></label></div>
      <div class="opcion"><div><b>${t("foto_b")}</b><small>${t("foto_s")}</small></div>
        <label class="interruptor"><input type="checkbox" id="e-capturas" ${q.capturas ? "checked" : ""} aria-label="${esc(t("foto_b"))}"><span></span></label></div>
      ${obra ? "" : `<label class="campo" style="margin-top:14px"><span>${t("aprender_como")}</span>
        <input type="text" id="e-aprender" value="${esc(q.aprender)}" placeholder="${esc(t("ph_aprender"))}" spellcheck="false">
        <small>${t("nota_aprender")}</small></label>
        <div class="opcion"><div><b>${t("exportar_b")}</b><small>${t("exportar_s")}</small></div>
          <label class="interruptor"><input type="checkbox" id="e-skill" ${q.exportar_skill ? "checked" : ""} aria-label="${esc(t("exportar_b"))}"><span></span></label></div>`}
      <details><summary>${t("jornal")}</summary><div class="fila" style="margin-top:6px;flex-wrap:wrap;gap:24px">
        <label class="valor">${t("pasos_max")}<input type="text" id="e-pasos" value="${q.max_pasos}" inputmode="numeric"></label>
        <label class="valor">${t("minutos_max")}<input type="text" id="e-minutos" value="${q.max_minutos}" inputmode="numeric"></label></div></details>
      <div class="botones" style="margin-top:22px"><button type="button" class="btn principal grande" id="e-ir">${t("dar_el_recado")}</button>
        <button type="button" class="btn discreto" id="e-anular">${t("dejarlo")}</button></div>
    </form>`;
  const leer = () => {
    q.objetivo = $("#e-objetivo").value;
    v.querySelectorAll("[data-param]").forEach((i) => q.parametros[i.dataset.param] = i.value);
    if ($("#e-sin")) q.sin_modelo = $("#e-sin").checked;
    if (otraWebActiva()) q.url = $("#e-url").value.trim();
    q.app = $("#e-app").value.trim();
    q.ver = $("#e-ver").checked; q.capturas = $("#e-capturas").checked;
    if ($("#e-aprender")) q.aprender = $("#e-aprender").value.trim();
    if ($("#e-skill")) q.exportar_skill = $("#e-skill").checked;
    q.max_pasos = Number($("#e-pasos").value) || 30; q.max_minutos = Number($("#e-minutos").value) || 10;
  };
  const otraWebActiva = () => !!v.querySelector('.web.on[data-otra="web"]');
  const objetivo = $("#e-objetivo");
  crecer(objetivo); objetivo.oninput = () => crecer(objetivo);
  if (!obra) objetivo.focus();
  v.querySelectorAll(".web").forEach((b) => b.onclick = () => {
    leer();
    v.querySelectorAll(".web").forEach((x) => x.classList.toggle("on", x === b));
    q.tipo = b.dataset.otra === "app" ? "app" : "web";
    if (b.dataset.url) q.url = b.dataset.url;
    $("#e-url").classList.toggle("oculto", b.dataset.otra !== "web");
    $("#e-app").classList.toggle("oculto", q.tipo !== "app");
    $("#e-app-nota").classList.toggle("oculto", q.tipo !== "app");
    if (b.dataset.otra === "web") { $("#e-url").value = ""; $("#e-url").focus(); }
    if (q.tipo === "app") $("#e-app").focus();
  });
  v.querySelectorAll("[data-permiso]").forEach((b) => b.onclick = () => {
    const k = b.dataset.permiso, i = q.permitir.indexOf(k);
    if (i >= 0) q.permitir.splice(i, 1); else q.permitir.push(k);
    b.classList.toggle("on", i < 0); $(".marca-check", b).innerHTML = i < 0 ? CHECK : "";
  });
  const soltar = $("#e-soltar");
  if (soltar) soltar.onclick = () => { leer(); q.habilidad = ""; q.sin_modelo = false; q.parametros = {}; pintar(); };
  $("#e-anular").onclick = () => { PEDIDO = null; VISTA = "portada"; pintar(); };
  $("#e-ir").onclick = async () => {
    leer();
    if (!q.objetivo.trim() && !q.habilidad) { objetivo.focus(); objetivo.placeholder = t("ph_falta"); return; }
    if (q.tipo === "app" && !q.app) { $("#e-app").focus(); return; }
    if (q.tipo === "web" && !q.url) { $("#e-url").classList.remove("oculto"); $("#e-url").focus(); return; }
    const cuerpo = {objetivo: q.objetivo.trim(), permitir: q.permitir, ver: q.ver, capturas: q.capturas, aprender: q.aprender,
      exportar_skill: !!(q.aprender && q.exportar_skill), habilidad: q.habilidad, sin_modelo: q.sin_modelo, parametros: q.parametros,
      max_pasos: q.max_pasos, max_minutos: q.max_minutos};
    if (q.tipo === "app") cuerpo.app = q.app; else cuerpo.url = q.url;
    $("#e-ir").disabled = true;
    const r = await api("/api/encargar", cuerpo);
    if (r.error) { $("#e-ir").disabled = false; avisar(r.error); return; }
    PEDIDO = null;
    await cargarEncargos();
    abrirEncargo(r.id);
  };
}

/* ---------- faenando y la libreta ---------- */
const cueHTML = (c) => `<li class="${esc(c.tipo)}"><span class="t">${esc(c.hora)}</span><span>${esc(c.texto)}</span></li>`;

function alto(q) {
  const que = q.categoria === "irreversible" ? t("ya_sin_vuelta") : t("es_sin_vuelta", {que: categoria(q.categoria)});
  return `<section class="alto" id="alto" aria-label="${esc(t("hace_falta_firma"))}"><span class="mano">${t("aqui_me_paro")}</span>
    <p class="accion">${esc(q.accion)}</p>
    <p class="pista">${esc(que)}${q.motivo ? t("por_que") + esc(q.motivo) : ""}</p>
    <div class="botones"><button class="btn principal grande" id="alto-si">${t("firmo")}</button>
      <button class="btn" id="alto-no">${t("quieto")}</button></div></section>`;
}

function encargo(v) {
  const e = E;
  const vivo = e.estado === "en-marcha" || e.estado === "pregunta";
  const inf = e.informe;
  const donde = e.superficie === "escritorio" ? t("el_programa", {p: esc(base(e.donde))}) : esc(nombreWeb(e.donde));
  const tope = e.max_pasos || 30;
  let cuerpo = "";
  if (vivo) {
    cuerpo = (e.pregunta ? alto(e.pregunta) : "") + `<div class="faenando" id="tarjeta-funcion">
      <div class="en-vivo"><i class="farol"></i><p class="dice">${e.pregunta ? t("esperando_firma") : t("voy")}</p></div>
      <div class="jornal"><span class="sc">${t("el_jornal")}</span><div class="palotes" id="f-palos" role="img" aria-label="${esc(t("n_pasos", {n: e.n}))}">${palotes(e.n)}</div>
        <small><span id="f-n">${e.n}</span> <span id="f-pasos">${e.n === 1 ? t("paso") : t("pasos")}</span> ${t("de_tope", {t: tope})}</small></div>
      <div class="ultimo ${e.ultimo ? "" : "espera"}" id="f-ultimo"><span>${esc(e.ultimo || t("mirando"))}</span></div>
      <p class="pista" style="margin:0">${t("en_donde", {d: donde, como: e.superficie === "escritorio" ? t("escritorio_aparte") : t("sin_ventana")})}${e.habilidad ? t("con_oficio", {o: esc(e.habilidad), s: e.sin_modelo ? t("coma_sin_pensar") : ""}) : ""}</p>
      <div class="progreso"><i id="f-barra" style="width:${Math.min(100, Math.round(e.n / tope * 100))}%"></i></div>
      <div class="botones" style="grid-column:1/-1;margin:0"><button class="btn claro" id="f-parar">${t("que_lo_deje")}</button></div></div>`;
  } else {
    const r = inf || {};
    const est = e.estado;
    let voz = "", aviso = "";
    if (est === "hecho") voz = t("hecho_voz");
    else if (est === "pendiente" && r.pendiente) {
      voz = t("me_pare");
      const porque = r.pendiente.categoria === "irreversible" ? t("no_tenia_vuelta") : t("es_cat", {c: esc(categoria(r.pendiente.categoria))});
      aviso = `<div class="alto"><p class="accion">${esc(r.pendiente.accion)}</p>
        <p class="pista">${t("lo_de_antes", {porque})}</p>
        <div class="botones"><button class="btn principal grande" id="i-permiso" data-cat="${esc(r.pendiente.categoria)}">${t("repetir_firma")}</button>
          <span class="pista">${t("a_mano")}</span></div></div>`;
    }
    else if (est === "parado") voz = t("me_mando_parar");
    else if (est === "interrumpido") { voz = t("se_corto"); aviso = `<div class="aviso mal"><p>${t("se_cerro")}</p>${e.error ? `<p>${esc(e.error)}</p>` : ""}</div>`; }
    else {
      voz = (r.avisos || []).some((a) => /tope|minutos|limit|minutes/.test(a)) ? t("sin_jornal") : t("no_pude");
      aviso = (r.avisos || []).filter((a) => a !== r.resumen).length ? `<div class="aviso mal">${(r.avisos || []).filter((a) => a !== r.resumen).map((a) => `<p>${esc(a)}</p>`).join("")}</div>` : "";
    }
    const pasos = r.pasos || [];
    const datos = [r.segundos != null ? `${Math.round(r.segundos)} s` : "", r.turnos != null ? (r.turnos === 1 ? t("vez_pense") : t("veces_pense", {n: r.turnos})) : "",
      r.habilidad ? t("oficio_memoria", {o: esc(r.habilidad.nombre), r: r.habilidad.repetidos, t: r.habilidad.total}) : ""].filter(Boolean).join(" · ");
    cuerpo += aviso + `<div class="libreta-abierta" id="libreta">
      <section><p class="dice">${esc(voz)}</p>${r.resumen ? `<p style="margin:0 0 6px">${esc(r.resumen)}</p>` : ""}
        <div class="fila" style="margin:4px 0"><div class="palotes" style="justify-content:flex-start" role="img" aria-label="${esc(t("n_pasos", {n: pasos.length}))}">${palotes(pasos.length)}</div></div>
        ${pasos.length ? `<ol class="guion-informe">${pasos.map((p) => `<li><b>${esc(p.desc || p.tipo)}</b></li>`).join("")}</ol>` : `<p class="mano" style="font-size:24px">${t("ni_un_paso")}</p>`}
        ${datos ? `<p class="pista">${datos}</p>` : ""}</section>
      <section aria-label="${esc(t("las_fotos"))}">${(r.capturas || []).length ? `<div class="capturas">${r.capturas.map((c) => `<a href="/api/encargos/${esc(e.id)}/captura/${esc(c)}" target="_blank" rel="noopener"><img src="/api/encargos/${esc(e.id)}/captura/${esc(c)}" alt="${esc(t("foto", {c}))}" loading="lazy"><small>${c.startsWith("final") ? t("al_acabar") : t("tras_paso", {n: Number(c.slice(0, 2))})}</small></a>`).join("")}</div>`
        : `<p class="mano" style="font-size:24px">${t("sin_fotos")}</p>`}</section></div>
      <div class="libreta-pie oscuro">
        ${est === "hecho" && !(r.habilidad && r.habilidad.repetidos === r.habilidad.total) ? `<button class="btn principal" id="i-aprender">${t("que_lo_aprenda")}</button>` : ""}
        <button class="btn" id="i-repetir">${t("repetirlo")}</button>
        <button class="btn discreto derecha" id="i-carpeta">${ico("carpeta")} ${t("abrir_carpeta")}</button></div>`;
  }
  cuerpo += `<div class="cabecera-pasos"><h2>${t("lo_que_apunta")}</h2><span class="contador derecha" id="f-cuenta">${t("renglones", {n: e.cues.length})}</span></div>
    <ol class="hoja-cues" id="hoja">${e.cues.length ? e.cues.map(cueHTML).join("") : `<li class="hoja-vacia">${t("aun_nada")}</li>`}</ol>`;
  v.innerHTML = guiaEncargo(vivo ? 1 : 2) + `<div class="titular"><h1>${esc(e.objetivo)}</h1>
    <div class="menu"><button class="icono-btn" id="btn-menu-encargo" aria-label="${esc(t("mas"))}" title="${esc(t("mas"))}">${ico("puntos", 20)}</button></div></div>
    <p class="sub cifra" style="font-size:14px;color:var(--ceniza)">${esc(e.creado)} · ${donde}</p>` + cuerpo;
  const hoja = $("#hoja"); hoja.scrollTop = hoja.scrollHeight;
  const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
  on("f-parar", () => confirmar(t("que_lo_deje_t"), t("que_lo_deje_p"), t("que_lo_deje"), async () => { await api(`/api/encargos/${e.id}/parar`, {}); abrirEncargo(e.id); cargarEncargos(); }));
  const responder = async (si) => { $("#alto").remove(); await api(`/api/encargos/${e.id}/responder`, {si}); avisar(si ? t("voy_aviso") : t("quieto_aviso")); };
  on("alto-si", () => responder(true));
  on("alto-no", () => responder(false));
  on("i-carpeta", () => api(`/api/encargos/${e.id}/abrir`, {}));
  on("i-repetir", () => { PEDIDO = pedidoDe(e); VISTA = "encargar"; pintar(); });
  on("i-permiso", () => { PEDIDO = pedidoDe(e); if (!PEDIDO.permitir.includes($("#i-permiso").dataset.cat)) PEDIDO.permitir.push($("#i-permiso").dataset.cat); VISTA = "encargar"; pintar(); });
  on("i-aprender", () => pedirNombre(t("aprender_t"), t("aprender_p"), nombreObra(e.objetivo), t("que_lo_aprenda"), async (nombre, skill) => {
    const r = await api(`/api/encargos/${e.id}/aprender`, {nombre, exportar_skill: skill});
    if (r.error) { avisar(r.error); return false; }
    await cargarEncargos(); aprendida(r);
  }));
  $("#btn-menu-encargo").onclick = (ev) => {
    ev.stopPropagation();
    const viejo = $(".menu-lista"); if (viejo) { viejo.remove(); return; }
    const m = document.createElement("div");
    m.className = "menu-lista";
    m.innerHTML = `<button data-m="carpeta">${ico("carpeta")} ${t("abrir_carpeta")}</button><button data-m="borrar" class="peligro">${ico("quitar")} ${t("tachar")}</button>`;
    $("#btn-menu-encargo").parentElement.append(m);
    m.onclick = (x) => {
      const o = x.target.closest("button"); if (!o) return; m.remove();
      if (o.dataset.m === "carpeta") api(`/api/encargos/${e.id}/abrir`, {});
      if (o.dataset.m === "borrar") confirmar(t("tachar_t"), t("tachar_p"), t("tacharlo"), async () => {
        await api(`/api/encargos/${e.id}/borrar`, {}); E = null; VISTA = "portada"; await cargarEncargos(); pintar(); avisar(t("tachado"));
      });
    };
  };
  if (vivo) vigilarEncargo();
}

function pedidoDe(e) {
  const p = e.pedido || {};
  const obra = REPERTORIO.find((o) => o.nombre === e.habilidad);
  const q = pedidoNuevo(obra);
  q.objetivo = e.habilidad && /^(Repetir «|Replay “)/.test(e.objetivo) ? "" : e.objetivo;
  if (e.superficie === "escritorio") { q.tipo = "app"; q.app = e.donde; } else if (e.donde) { q.tipo = "web"; q.url = e.donde; }
  q.permitir = [...(p.permitir || [])]; q.ver = !!p.ver; q.capturas = p.capturas !== false; q.sin_modelo = !!e.sin_modelo;
  if (p.parametros) q.parametros = {...q.parametros, ...p.parametros};
  q.max_pasos = e.max_pasos || 30; q.max_minutos = e.max_minutos || 10;
  return q;
}

function vigilarEncargo() {
  sondeo = setInterval(async () => {
    const q = await api(`/api/encargos/${E.id}`);
    if (q.error || VISTA !== "encargo" || q.id !== E.id) return;
    const repintar = q.estado !== E.estado || !!q.pregunta !== !!E.pregunta;
    const nuevas = q.cues.slice(E.cues.length);
    E = q;
    if (repintar) { pintar(); cargarEncargos(); return; }
    $("#f-n").textContent = q.n; $("#f-pasos").textContent = q.n === 1 ? t("paso") : t("pasos");
    $("#f-palos").innerHTML = palotes(q.n); $("#f-palos").setAttribute("aria-label", t("n_pasos", {n: q.n}));
    $("#f-barra").style.width = Math.min(100, Math.round(q.n / (q.max_pasos || 30) * 100)) + "%";
    if (q.ultimo) {
      const u = $("#f-ultimo");
      if (u.textContent !== q.ultimo) { u.classList.remove("espera", "nuevo"); void u.offsetWidth; u.classList.add("nuevo"); u.innerHTML = `<span>${esc(q.ultimo)}</span>`; }
    }
    if (nuevas.length) {
      const hoja = $("#hoja"), abajo = hoja.scrollTop + hoja.clientHeight >= hoja.scrollHeight - 30;
      $(".hoja-vacia", hoja)?.remove();
      hoja.insertAdjacentHTML("beforeend", nuevas.map(cueHTML).join(""));
      if (abajo) hoja.scrollTop = hoja.scrollHeight;
      $("#f-cuenta").textContent = t("renglones", {n: q.cues.length});
    }
  }, 1000);
}

/* ---------- oficios ---------- */
function repertorio(v) {
  v.innerHTML = `<h1>${t("oficios_h1")}</h1>
    <p class="dice">${t("oficios_dice")}</p>
    <p class="sub">${t("oficios_sub")}</p>
    ${REPERTORIO.length ? `<div class="pared">${REPERTORIO.map((o) => `<article class="obra">
      <span class="cifra">${o.superficie === "escritorio" ? t("en_programa") : t("en_web")} · ${o.pasos.length} ${o.pasos.length === 1 ? t("paso") : t("pasos")}${o.aprendida ? t("aprendido_el", {f: esc(o.aprendida)}) : ""}</span>
      <h2>${esc(o.nombre)}</h2><p>${conHuecos(o.descripcion)}</p>
      ${Object.keys(o.parametros).length ? `<div class="reparto">${Object.entries(o.parametros).map(([k, ej]) => `<span title="${esc(t("ejemplo", {e: ej}))}">${esc(k)}</span>`).join("")}</div>` : ""}
      <details><summary>${t("los_pasos")}</summary><ol class="lista-num">${o.pasos.map((p) => `<li><span>${conHuecos(p)}</span></li>`).join("")}</ol></details>
      <div class="botones"><button class="btn principal" data-usar="${esc(o.nombre)}">${t("hacerlo")}</button>
        <button class="btn" data-sinpensar="${esc(o.nombre)}" title="${esc(t("sin_pensar_title"))}">${t("sin_pensar")}</button>
        <button class="btn" data-skill="${esc(o.nombre)}" title="${esc(t("como_skill_title"))}">${t("como_skill")}</button>
        <button class="btn discreto" data-olvidar="${esc(o.nombre)}">${t("descoserlo")}</button></div></article>`).join("")}</div>`
    : `<div class="hoja"><h2>${t("ninguno_aun")}</h2><ol class="lista-num cifra" style="font-size:15px;line-height:32px">
        <li>${t("ninguno_1")}</li>
        <li>${t("ninguno_2")}</li></ol>
        <div class="botones"><button class="btn principal" id="r-encargar">${t("dar_recado")}</button></div></div>`}`;
  const usar = (nombre, sin) => { PEDIDO = pedidoNuevo(REPERTORIO.find((o) => o.nombre === nombre)); PEDIDO.sin_modelo = sin; VISTA = "encargar"; pintar(); };
  v.querySelectorAll("[data-usar]").forEach((b) => b.onclick = () => usar(b.dataset.usar, false));
  v.querySelectorAll("[data-sinpensar]").forEach((b) => b.onclick = () => usar(b.dataset.sinpensar, true));
  v.querySelectorAll("[data-skill]").forEach((b) => b.onclick = async () => {
    const r = await api(`/api/repertorio/${b.dataset.skill}/skill`, {});
    avisar(r.error ? r.error : t("skill_escrita", {r: r.ruta}));
  });
  v.querySelectorAll("[data-olvidar]").forEach((b) => b.onclick = () => confirmar(t("descoser_t", {o: b.dataset.olvidar}), t("descoser_p"), t("descoserlo"), async () => {
    await api(`/api/repertorio/${b.dataset.olvidar}/olvidar`, {}); await cargarEncargos(); pintar(); avisar(t("descosido"));
  }));
  const r = $("#r-encargar"); if (r) r.onclick = () => { PEDIDO = null; VISTA = "encargar"; pintar(); };
  v.insertAdjacentHTML("beforeend", `<div class="ensenar oscuro"><h2>${t("ensenar_h")}</h2>
    <p class="pista">${t("ensenar_p")}</p>
    <div class="fila"><input type="text" id="r-origen" placeholder="${esc(t("ph_origen"))}" spellcheck="false" aria-label="${esc(t("aria_origen"))}">
      <button class="btn" id="r-ensenar">${t("coserlo_aqui")}</button></div>
    <div class="opcion" style="border-top-color:rgba(219,198,165,.3)"><div><b>${t("exportar_b")}</b><small style="color:var(--cal-sucia)">${t("exportar_s")}</small></div>
      <label class="interruptor"><input type="checkbox" id="r-skill" aria-label="${esc(t("exportar_b"))}"><span style="border-color:var(--estraza)"></span></label></div>
    <div class="botones" style="margin-top:14px"><button class="btn discreto" id="r-carpeta">${ico("carpeta")} ${t("abrir_oficios")}</button></div></div>`);
  $("#r-carpeta").onclick = () => api("/api/abrir-repertorio", {});
  $("#r-ensenar").onclick = () => {
    const origen = $("#r-origen").value.trim(); if (!origen) return $("#r-origen").focus();
    const sugerido = nombreObra(base(origen.replace(/[\\/]proyecto\.json$/i, "")));
    const marcada = $("#r-skill").checked;
    pedirNombre(t("aprender_t"), t("aprender_p"), sugerido, t("coserlo"), async (nombre, skill) => {
      const r = await api("/api/aprender", {origen, nombre, exportar_skill: skill || marcada});
      if (r.error) { avisar(r.error); return false; }
      await cargarEncargos(); pintar(); aprendida(r);
    });
    if (marcada) { const c = $("#d-skill"); if (c) c.checked = true; }
  };
}

/* ---------- ajustes ---------- */
function ajustes(v) {
  const a = {...(INICIO.ajustes || {})};
  if (!a.idioma) a.idioma = LANG;
  a.ia_backend = a.ia_backend || "";
  const seg = (clave, opciones) => `<div class="segmentos" data-clave="${clave}">${opciones.map(([val, txt]) =>
    `<button type="button" data-v="${val}" class="${(a[clave] || "") === val ? "on" : ""}">${txt}</button>`).join("")}</div>`;
  v.innerHTML = `<h1>${t("ajustes_h1")}</h1>
    <p class="dice">${t("ajustes_dice")}</p>
    <p class="sub">${t("ajustes_sub")}</p>
    <form class="hoja" id="tarjeta-ajustes" onsubmit="return false">
      <div class="campo"><span>${t("idioma")}</span>${seg("idioma", [["en", "English"], ["es", "Español"]])}<small>${t("idioma_sub")}</small></div>
      <div class="campo" id="a-ia"><span>${t("ia")}</span>
        ${seg("ia_backend", [["", t("ia_auto")], ["ollama", "Ollama"], ["claude", "Claude"], ["openai", t("ia_openai")]])}
        <small>${t("ia_sub")}</small>
        <p class="pista ia-solo" data-para="">${t("ia_auto_sub")}</p>
        <p class="pista ia-solo" data-para="claude openai" style="color:var(--sangre)">${t("ia_remoto")}</p>
        <label class="campo ia-solo" data-para="ollama openai" style="margin-top:12px"><span id="a-ia-url-t"></span>
          <input type="text" id="a-ia-url" value="${esc(a.ia_url || "")}" spellcheck="false"></label>
        <label class="campo ia-solo" data-para="ollama claude openai"><span>${t("ia_modelo")}</span>
          <div class="fila"><input type="text" id="a-ia-modelo" list="a-ia-lista" value="${esc(a.ia_modelo || "")}" placeholder="${esc(t("ia_modelo_ph"))}" spellcheck="false" style="flex:1">
          <button class="btn" id="a-ia-cargar" type="button">${t("ia_cargar")}</button></div>
          <datalist id="a-ia-lista"></datalist><small id="a-ia-n"></small></label>
        <label class="campo ia-solo" data-para="claude openai"><span>${t("ia_clave")}</span>
          <input type="password" id="a-ia-clave" autocomplete="off" placeholder="${esc(t("ia_clave_ph"))}" spellcheck="false">
          <small id="a-ia-clave-nota">${a.ia_clave_guardada ? t("ia_clave_guardada", {fin: esc(a.ia_clave_fin || "")}) + ` <a href="#" id="a-ia-borrar">${t("ia_clave_borrar")}</a>` : t("ia_clave_nota")}</small></label>
        <div class="botones"><button class="btn" id="a-ia-probar" type="button">${ico("bombilla")} ${t("ia_probar")}</button>
          <span class="pista" id="a-ia-resultado">${INICIO.ia ? esc(t("ia_ahora", {ia: INICIO.ia})) : ""}</span></div></div>
      <div class="botones" style="margin-top:22px"><button type="button" class="btn principal grande" id="a-ok">${t("guardar")}</button></div>
    </form>
    <div class="ensenar oscuro"><h2>${t("skills_h")}</h2><p class="pista">${t("skills_p", {d: esc(INICIO.skills || "~/.claude/skills")})}</p></div>`;
  v.querySelectorAll(".segmentos").forEach((g) => g.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const antes = a[g.dataset.clave] || "";
    a[g.dataset.clave] = b.dataset.v;
    g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    if (g.dataset.clave === "ia_backend" && antes !== b.dataset.v) {
      // The model and the server belong to the backend they were written for.
      $("#a-ia-modelo").value = ""; $("#a-ia-url").value = ""; $("#a-ia-lista").innerHTML = ""; $("#a-ia-n").textContent = ""; $("#a-ia-resultado").textContent = "";
      iaVista();
    }
  });
  const iaVista = () => {
    const b = a.ia_backend || "";
    v.querySelectorAll(".ia-solo").forEach((el) => { el.style.display = el.dataset.para.split(" ").includes(b) ? "" : "none"; });
    $("#a-ia-url-t").textContent = b === "openai" ? t("ia_url_openai") : t("ia_url_ollama");
    $("#a-ia-url").placeholder = b === "openai" ? "http://127.0.0.1:1234/v1" : "http://localhost:11434";
  };
  const borrador = () => ({ia_backend: a.ia_backend || "", ia_url: $("#a-ia-url").value.trim(), ia_modelo: $("#a-ia-modelo").value.trim(), ia_clave: $("#a-ia-clave").value.trim()});
  $("#a-ia-cargar").onclick = async () => {
    const n = $("#a-ia-n"); n.textContent = t("ia_probando");
    const r = await api("/api/ia/modelos", borrador());
    if (r.error || r.ok === false) { n.textContent = t("ia_mal", {e: r.error}); return; }
    $("#a-ia-lista").innerHTML = (r.modelos || []).map((m) => `<option value="${esc(m)}">`).join("");
    n.textContent = t("ia_modelos_n", {n: (r.modelos || []).length});
    if (!$("#a-ia-modelo").value && r.modelo) $("#a-ia-modelo").placeholder = r.modelo;
  };
  $("#a-ia-probar").onclick = async () => {
    const res = $("#a-ia-resultado"); res.textContent = t("ia_probando");
    const r = await api("/api/ia/probar", borrador());
    res.textContent = r.ok ? "✓ " + t("ia_ok", {m: `${r.backend} · ${r.modelo}`, s: (r.ms / 1000).toFixed(1)}) : "✗ " + t("ia_mal", {e: r.error});
  };
  const borrar = $("#a-ia-borrar");
  if (borrar) borrar.onclick = (e) => { e.preventDefault(); a.ia_clave_borrar = true; $("#a-ia-clave-nota").textContent = t("ia_clave_nota"); };
  iaVista();
  $("#a-ok").onclick = async () => {
    const cuerpo = {idioma: a.idioma, ...borrador()};
    if (a.ia_clave_borrar) cuerpo.ia_clave_borrar = true;
    const r = await api("/api/ajustes", cuerpo);
    if (r.error) { avisar(r.error); return; }
    await cargarInicio(); pintar(); avisar(t("ajustes_ok"));
  };
}

$("#btn-encargar").onclick = () => { E = null; PEDIDO = null; VISTA = "encargar"; pintar(); pintarEncargos(); };
$("#btn-repertorio").onclick = async () => { E = null; await cargarEncargos(); VISTA = "repertorio"; pintar(); pintarEncargos(); };
$("#btn-ajustes").onclick = () => { E = null; VISTA = "ajustes"; pintar(); pintarEncargos(); };
document.addEventListener("click", () => { const m = $(".menu-lista"); if (m) m.remove(); });
setInterval(() => { if (VISTA !== "encargo" && VISTA !== "ajustes") cargarEncargos(); }, 5000);

(async () => {
  await cargarInicio();
  const vivo = ENCARGOS.find((e) => e.estado === "en-marcha" || e.estado === "pregunta");
  if (vivo) abrirEncargo(vivo.id); else pintar();
})();
</script>
</body>
